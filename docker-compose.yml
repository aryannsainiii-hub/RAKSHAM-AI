services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    volumes: ["raksham-data:/data"]
    environment:
      RAKSHAM_DB_PATH: /data/raksham.sqlite3
      RAKSHAM_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  raksham-data:
